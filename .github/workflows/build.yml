name: Build iOS App and Release IPA

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (unsigned)
        run: |
          xcodebuild -project AniAnglia.xcodeproj \
            -scheme iOSAnixart \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          [ -z "$APP_PATH" ] && echo "app not found" && exit 1
          mkdir Payload && cp -R "$APP_PATH" Payload/
          zip -qr AniAnglia.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AniLot.ipa
          path: AniLot.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: AniLot ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          files: AniLot.ipa
